databaseChangeLog:
  - changeSet:
      id: 001-create-types
      author: jean
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: types
      changes:
        - createTable:
            tableName: types
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: libelle
                  type: varchar(255)

  - changeSet:
      id: 002-create-products
      author: jean
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: products
      changes:
        - createTable:
            tableName: products
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: libelle
                  type: varchar(255)
              - column:
                  name: prix
                  type: double precision
                  constraints:
                    nullable: false